<!DOCTYPE html>
<html>
<head>
    <title>Test Public URL Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Test Public Website URL for XBRL</h1>
    <button onclick="testPublicURL()">Test Public URL via Worker</button>
    <div id="results"></div>
    
    <script src="finance-parser-minimal.js"></script>
    <script src="real-xbrl-parser.js"></script>
    
    <script>
        async function testPublicURL() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Testing...</h2>';
            
            const COMPANY_NUMBER = '09051662';
            const TRANSACTION_ID = 'MzQzNzQ4MTU2NGFkaXF6a2N4';
            const API_KEY = '22aefa40-ee9e-47c0-b40a-2dd3c03165c6';
            const WORKER_URL = 'https://blue-flower-d40f.mahin84.workers.dev';
            
            // Test the public website URL pattern
            const publicUrl = `https://find-and-update.company-information.service.gov.uk/company/${COMPANY_NUMBER}/filing-history/${TRANSACTION_ID}/document?format=xhtml&download=0`;
            const workerUrl = `${WORKER_URL}/?url=${encodeURIComponent(publicUrl)}&key=${API_KEY}&accept=application/xhtml%2Bxml`;
            
            results.innerHTML += `<p><strong>Public URL:</strong> ${publicUrl}</p>`;
            results.innerHTML += `<p><strong>Worker URL:</strong> ${workerUrl}</p>`;
            
            try {
                const response = await fetch(workerUrl);
                const contentType = response.headers.get('content-type');
                
                results.innerHTML += `<p><strong>Status:</strong> ${response.status}</p>`;
                results.innerHTML += `<p><strong>Content-Type:</strong> ${contentType}</p>`;
                
                if (response.ok) {
                    const text = await response.text();
                    results.innerHTML += `<p class="success">✅ Success! Got ${text.length} characters</p>`;
                    
                    if (text.includes('ix:') || text.includes('xmlns:ix')) {
                        results.innerHTML += '<p class="success">✅ Contains XBRL markers</p>';
                        
                        // Try to parse it
                        try {
                            const parsed = RealXBRLParser.parse(text);
                            results.innerHTML += '<h3>Parsed Financial Data:</h3>';
                            results.innerHTML += `<p>Total Assets: ${parsed.totalAssets?.value || 'Not found'}</p>`;
                            results.innerHTML += `<p>Net Assets: ${parsed.netAssets?.value || 'Not found'}</p>`;
                            results.innerHTML += `<p>Total Liabilities: ${parsed.totalLiabilities?.value || 'Not found'}</p>`;
                        } catch (e) {
                            results.innerHTML += `<p class="error">Parse error: ${e.message}</p>`;
                        }
                    } else if (text.startsWith('%PDF')) {
                        results.innerHTML += '<p class="error">❌ Got PDF instead of XBRL</p>';
                    }
                } else {
                    const errorText = await response.text();
                    results.innerHTML += `<p class="error">❌ Error: ${errorText}</p>`;
                }
                
                // Now test the full finance parser
                results.innerHTML += '<h3>Testing Full Finance Parser...</h3>';
                const financeData = await FinanceParser.extractFinancialData(COMPANY_NUMBER);
                
                if (financeData.historicalData && financeData.historicalData.length > 0) {
                    results.innerHTML += `<p class="success">✅ Finance parser returned ${financeData.historicalData.length} years of data</p>`;
                    const latest = financeData.historicalData[0];
                    results.innerHTML += `<p>Latest year: ${latest.year}</p>`;
                    results.innerHTML += `<p>Total Assets: ${latest.metrics.totalAssets?.value}</p>`;
                    results.innerHTML += `<p>Net Assets: ${latest.metrics.netAssets?.value}</p>`;
                } else {
                    results.innerHTML += '<p class="error">❌ No financial data returned</p>';
                }
                
            } catch (error) {
                results.innerHTML += `<p class="error">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
