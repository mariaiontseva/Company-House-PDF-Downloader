<!DOCTYPE html>
<html>
<head>
    <title>Officer Search Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { background: #f5f5f5; padding: 20px; margin: 20px 0; border-radius: 8px; }
        pre { background: #333; color: #0f0; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Officer Search Debug</h1>
    
    <div class="debug-section">
        <h2>Test Officer Search API</h2>
        <input type="text" id="searchQuery" placeholder="Enter officer name" value="SMITH" style="width: 300px; padding: 8px;">
        <button onclick="testSearch()">Search</button>
        
        <div id="results"></div>
    </div>
    
    <script>
        async function testSearch() {
            const query = document.getElementById('searchQuery').value;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '<p>Searching...</p>';
            
            try {
                const response = await fetch(`http://localhost:3002/api/proxy/companies-house/search/officers?q=${encodeURIComponent(query)}&items_per_page=5`);
                const data = await response.json();
                
                resultsDiv.innerHTML = '<h3>API Response:</h3>';
                resultsDiv.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.items && data.items.length > 0) {
                    resultsDiv.innerHTML += '<h3>Extracted Officer IDs:</h3>';
                    data.items.forEach((item, index) => {
                        const officerId = item.links && item.links.self ? item.links.self.split('/').pop() : 'NO_ID';
                        resultsDiv.innerHTML += `
                            <div style="margin: 10px 0; padding: 10px; background: white; border-radius: 4px;">
                                <strong>Officer ${index + 1}: ${item.title}</strong><br>
                                <code>links.self: ${item.links?.self || 'MISSING'}</code><br>
                                <code>Extracted ID: ${officerId}</code><br>
                                <button onclick="window.open('http://localhost:8080/#officer/${officerId}', '_blank')">
                                    Open Officer Page
                                </button>
                            </div>
                        `;
                    });
                }
                
            } catch (error) {
                resultsDiv.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
        
        // Auto-run on load
        window.onload = () => testSearch();
    </script>
</body>
</html>
