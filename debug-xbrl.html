<!DOCTYPE html>
<html>
<head>
    <title>Debug XBRL Download</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        pre { background: #f0f0f0; padding: 10px; overflow: auto; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Debug XBRL Download</h1>
    <button onclick="debugDownload()">Download and Debug XBRL</button>
    <div id="output"></div>
    
    <script src="finance-parser.js"></script>
    <script>
        async function debugDownload() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Fetching filing history...</p>';
            
            try {
                // Get filing history
                const companyNumber = '05254058';
                const response = await fetch(`http://localhost:3002/api/proxy/companies-house/company/${companyNumber}/filing-history?category=accounts&items_per_page=10`);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch filing history: ${response.status}`);
                }
                
                const data = await response.json();
                const filings = data.items.filter(item => 
                    item.category === 'accounts' && 
                    item.links && 
                    item.links.document_metadata
                );
                
                if (filings.length === 0) {
                    output.innerHTML = '<p class="error">No accounts filings found</p>';
                    return;
                }
                
                // Get the latest filing
                const filing = filings[0];
                output.innerHTML += `<p>Found filing: ${filing.description} (${filing.date})</p>`;
                
                // Try to download XBRL
                const transactionId = filing.transaction_id;
                const xbrlUrl = `http://localhost:3002/api/proxy/ixbrl/${companyNumber}/${transactionId}?format=xhtml`;
                
                output.innerHTML += `<p>Downloading XBRL from: ${xbrlUrl}</p>`;
                
                const xbrlResponse = await fetch(xbrlUrl);
                const xbrlText = await xbrlResponse.text();
                
                output.innerHTML += `<h2>Response Status: ${xbrlResponse.status}</h2>`;
                output.innerHTML += `<p>Content Length: ${xbrlText.length} characters</p>`;
                output.innerHTML += `<p>Content Type: ${xbrlResponse.headers.get('content-type')}</p>`;
                
                // Show first 2000 characters
                output.innerHTML += '<h3>First 2000 characters:</h3>';
                output.innerHTML += `<pre>${escapeHtml(xbrlText.substring(0, 2000))}</pre>`;
                
                // Look for XBRL tags
                const xbrlTags = [];
                const tagPattern = /name="([^"]+)"/g;
                let match;
                while ((match = tagPattern.exec(xbrlText)) !== null) {
                    xbrlTags.push(match[1]);
                }
                
                output.innerHTML += `<h3>Found ${xbrlTags.length} XBRL tags:</h3>`;
                output.innerHTML += '<ul>';
                xbrlTags.slice(0, 50).forEach(tag => {
                    output.innerHTML += `<li>${tag}</li>`;
                });
                output.innerHTML += '</ul>';
                
                // Look for specific values
                output.innerHTML += '<h3>Looking for specific values:</h3>';
                const searchPatterns = [
                    /BalanceSheetTotal[^>]*>([^<]+)</g,
                    /TotalAssets[^>]*>([^<]+)</g,
                    /ShareholdersFunds[^>]*>([^<]+)</g,
                    /NetAssets[^>]*>([^<]+)</g,
                    /Creditors[^>]*>([^<]+)</g,
                    /CurrentAssets[^>]*>([^<]+)</g,
                    /FixedAssets[^>]*>([^<]+)</g
                ];
                
                searchPatterns.forEach(pattern => {
                    const matches = [...xbrlText.matchAll(pattern)];
                    if (matches.length > 0) {
                        output.innerHTML += `<p>${pattern.source}: Found ${matches.length} matches</p>`;
                        matches.forEach(m => {
                            output.innerHTML += `<pre>  Value: ${m[1]}</pre>`;
                        });
                    }
                });
                
            } catch (error) {
                output.innerHTML += `<p class="error">Error: ${error.message}</p>`;
                console.error('Debug error:', error);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
