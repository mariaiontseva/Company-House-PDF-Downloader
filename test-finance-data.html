<!DOCTYPE html>
<html>
<head>
    <title>Test Finance Data Loading</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        #results {
            background: white;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Testing Finance Data Loading for Company 05254058</h1>
    <div id="status"></div>
    <button onclick="testFinanceData()">Test Finance Data Loading</button>
    <div id="results"></div>
    
    <script src="real-xbrl-parser.js"></script>
    <script src="finance-parser-minimal.js"></script>
    
    <script>
        function addStatus(message, type = 'info') {
            const status = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            status.appendChild(div);
        }
        
        function showResults(data) {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Results:</h2><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
        
        async function testFinanceData() {
            const companyNumber = '05254058';
            
            addStatus('Starting test...');
            
            // Check if parsers are loaded
            addStatus(`RealXBRLParser loaded: ${typeof RealXBRLParser !== 'undefined'}`, 
                     typeof RealXBRLParser !== 'undefined' ? 'success' : 'error');
            addStatus(`FinanceParser loaded: ${typeof FinanceParser !== 'undefined'}`, 
                     typeof FinanceParser !== 'undefined' ? 'success' : 'error');
            
            if (typeof FinanceParser === 'undefined') {
                addStatus('FinanceParser not loaded!', 'error');
                return;
            }
            
            try {
                addStatus(`Extracting financial data for company ${companyNumber}...`);
                const data = await FinanceParser.extractFinancialData(companyNumber);
                
                addStatus(`Found ${data.totalFilings} total filings`, 'info');
                addStatus(`Extracted data from ${data.filingsWithData} filings`, 
                         data.filingsWithData > 0 ? 'success' : 'error');
                
                // Show detailed results
                showResults(data);
                
                // Log to console for debugging
                console.log('Financial data:', data);
                
                // Display summary of each year's data
                if (data.historicalData && data.historicalData.length > 0) {
                    addStatus('Financial data by year:', 'info');
                    data.historicalData.forEach(yearData => {
                        const metrics = yearData.metrics;
                        addStatus(`${yearData.year}: Assets=${metrics.totalAssets.value}, Liabilities=${metrics.totalLiabilities.value}, Net=${metrics.netAssets.value}`, 'success');
                    });
                } else {
                    addStatus('No historical data extracted', 'error');
                }
                
            } catch (error) {
                addStatus(`Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }
        
        // Also check console output
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            if (args[0] && typeof args[0] === 'string' && args[0].includes('🔸')) {
                addStatus(args.join(' '), 'info');
            }
        };
    </script>
</body>
</html>
