<!DOCTYPE html>
<html>
<head>
    <title>Test XBRL Tags</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .tag-list {
            background: white;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        .tag-item {
            padding: 5px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .tag-value {
            color: #0066cc;
            font-weight: bold;
        }
        .highlight {
            background: #fff3cd;
            border: 1px solid #ffc107;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>XBRL Tag Discovery for Company 05254058</h1>
    <button onclick="findAllTags()">Find All XBRL Tags</button>
    <button onclick="findEmployeeTags()">Find Employee-Related Tags</button>
    <div id="results"></div>
    
    <script>
        async function findAllTags() {
            const companyNumber = '05254058';
            const results = document.getElementById('results');
            results.innerHTML = '<p>Loading...</p>';
            
            try {
                // Get filing history
                const proxyUrl = `http://localhost:3002/api/proxy/companies-house/company/${companyNumber}/filing-history?category=accounts&items_per_page=5`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const filing = data.items[0]; // Most recent filing
                    
                    if (filing.transaction_id) {
                        // Fetch XBRL
                        const xbrlUrl = `http://localhost:3002/api/proxy/ixbrl/${companyNumber}/${filing.transaction_id}?format=xhtml`;
                        const xbrlResponse = await fetch(xbrlUrl);
                        const xbrlText = await xbrlResponse.text();
                        
                        // Parse XBRL
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(xbrlText, 'text/html');
                        
                        // Find all XBRL elements
                        const allTags = new Map();
                        
                        // Find all elements with 'name' attribute (XBRL tags)
                        const elements = doc.querySelectorAll('[name]');
                        elements.forEach(element => {
                            const name = element.getAttribute('name');
                            const value = element.textContent.trim();
                            const contextRef = element.getAttribute('contextRef') || 'default';
                            
                            if (!allTags.has(name)) {
                                allTags.set(name, []);
                            }
                            allTags.set(name, [...allTags.get(name), { value, contextRef }]);
                        });
                        
                        // Display results
                        let html = '<div class="tag-list">';
                        html += `<h3>Found ${allTags.size} unique XBRL tags in ${filing.description}</h3>`;
                        
                        // Sort tags alphabetically
                        const sortedTags = Array.from(allTags.entries()).sort((a, b) => a[0].localeCompare(b[0]));
                        
                        sortedTags.forEach(([tag, values]) => {
                            const isEmployeeRelated = tag.toLowerCase().includes('employee') || 
                                                    tag.toLowerCase().includes('staff') ||
                                                    tag.toLowerCase().includes('worker');
                            html += `<div class="tag-item ${isEmployeeRelated ? 'highlight' : ''}">`;
                            html += `<strong>${tag}</strong><br>`;
                            values.forEach(v => {
                                html += `Context: ${v.contextRef} → <span class="tag-value">${v.value}</span><br>`;
                            });
                            html += '</div>';
                        });
                        
                        html += '</div>';
                        results.innerHTML = html;
                    }
                }
            } catch (error) {
                results.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        async function findEmployeeTags() {
            const companyNumber = '05254058';
            const results = document.getElementById('results');
            results.innerHTML = '<p>Loading employee-related tags...</p>';
            
            try {
                // Get filing history
                const proxyUrl = `http://localhost:3002/api/proxy/companies-house/company/${companyNumber}/filing-history?category=accounts&items_per_page=5`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const filing = data.items[0];
                    
                    if (filing.transaction_id) {
                        // Fetch XBRL
                        const xbrlUrl = `http://localhost:3002/api/proxy/ixbrl/${companyNumber}/${filing.transaction_id}?format=xhtml`;
                        const xbrlResponse = await fetch(xbrlUrl);
                        const xbrlText = await xbrlResponse.text();
                        
                        // Parse XBRL
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(xbrlText, 'text/html');
                        
                        // Find employee-related tags
                        const employeeTags = new Map();
                        const possibleTags = [
                            'employee', 'staff', 'worker', 'personnel', 'headcount', 
                            'fte', 'workforce', 'number', 'average'
                        ];
                        
                        const elements = doc.querySelectorAll('[name]');
                        elements.forEach(element => {
                            const name = element.getAttribute('name');
                            const nameLower = name.toLowerCase();
                            
                            // Check if tag contains any employee-related keywords
                            if (possibleTags.some(keyword => nameLower.includes(keyword))) {
                                const value = element.textContent.trim();
                                const contextRef = element.getAttribute('contextRef') || 'default';
                                
                                if (!employeeTags.has(name)) {
                                    employeeTags.set(name, []);
                                }
                                employeeTags.set(name, [...employeeTags.get(name), { value, contextRef }]);
                            }
                        });
                        
                        // Also search for any text content that might contain employee numbers
                        const textNodes = doc.body.innerText.match(/\b\d+\s*employees?\b/gi) || [];
                        
                        // Display results
                        let html = '<div class="tag-list">';
                        html += `<h3>Employee-related tags in ${filing.description}</h3>`;
                        
                        if (employeeTags.size > 0) {
                            employeeTags.forEach((values, tag) => {
                                html += `<div class="tag-item highlight">`;
                                html += `<strong>${tag}</strong><br>`;
                                values.forEach(v => {
                                    html += `Context: ${v.contextRef} → <span class="tag-value">${v.value}</span><br>`;
                                });
                                html += '</div>';
                            });
                        } else {
                            html += '<p>No employee-related XBRL tags found.</p>';
                        }
                        
                        if (textNodes.length > 0) {
                            html += '<h4>Text mentions of employees:</h4>';
                            textNodes.forEach(text => {
                                html += `<div class="tag-item">${text}</div>`;
                            });
                        }
                        
                        html += '</div>';
                        results.innerHTML = html;
                    }
                }
            } catch (error) {
                results.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
