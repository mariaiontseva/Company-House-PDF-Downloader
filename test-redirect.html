<!DOCTYPE html>
<html>
<head>
    <title>Test Redirect</title>
</head>
<body>
    <h1>Test Redirect Page</h1>
    <p id="status">Checking URL...</p>
    
    <script>
        console.log('Page loaded');
        console.log('Current URL:', window.location.href);
        console.log('Query string:', window.location.search);
        
        const queryString = window.location.search.substring(1);
        const isOldFormat = queryString && !queryString.includes('=') && /^[0-9A-Z]{8}$/i.test(queryString);
        
        document.getElementById('status').innerHTML = `
            Query string: ${queryString}<br>
            Is old format: ${isOldFormat}<br>
            Should redirect to: #company/${queryString}
        `;
        
        if (isOldFormat) {
            console.log('Redirecting to:', `#company/${queryString}`);
            setTimeout(() => {
                window.location.hash = `#company/${queryString}`;
                document.getElementById('status').innerHTML += '<br>Redirected!';
            }, 1000);
        }
    </script>
</body>
</html>
