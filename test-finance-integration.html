<!DOCTYPE html>
<html>
<head>
    <title>Test Finance Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        #results {
            background: white;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .chart-container {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 20px;
            background: white;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Testing Finance Integration for Company 05254058</h1>
    <div id="status"></div>
    <button onclick="testFullIntegration()">Test Full Integration</button>
    <button onclick="testSingleFiling()">Test Single Filing</button>
    <button onclick="clearStatus()">Clear</button>
    <div id="results"></div>
    
    <script src="real-xbrl-parser.js"></script>
    <script src="finance-parser-minimal.js"></script>
    
    <script>
        // Intercept console logs
        const originalLog = console.log;
        const originalError = console.error;
        let logBuffer = [];
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logBuffer.push({type: 'log', args: args});
            if (args[0] && typeof args[0] === 'string' && args[0].includes('🔸')) {
                addStatus(args.join(' '), 'info');
            }
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logBuffer.push({type: 'error', args: args});
            addStatus('ERROR: ' + args.join(' '), 'error');
        };
        
        function addStatus(message, type = 'info') {
            const status = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            status.appendChild(div);
            // Auto scroll to bottom
            status.scrollTop = status.scrollHeight;
        }
        
        function clearStatus() {
            document.getElementById('status').innerHTML = '';
            document.getElementById('results').innerHTML = '';
            logBuffer = [];
        }
        
        function showResults(data) {
            const results = document.getElementById('results');
            let html = '<h2>Results:</h2>';
            
            if (data.historicalData && data.historicalData.length > 0) {
                html += `<h3>Extracted ${data.filingsWithData} filings with financial data:</h3>`;
                html += '<table border="1" cellpadding="5" cellspacing="0" style="width: 100%">';
                html += '<tr><th>Year</th><th>Total Assets</th><th>Total Liabilities</th><th>Net Assets</th><th>Check (A=L+NA)</th></tr>';
                
                data.historicalData.forEach(yearData => {
                    const assets = yearData.metrics.totalAssets?.value || 0;
                    const liabilities = yearData.metrics.totalLiabilities?.value || 0;
                    const netAssets = yearData.metrics.netAssets?.value || 0;
                    const check = assets - (liabilities + netAssets);
                    const checkOk = Math.abs(check) < 10;
                    
                    html += `<tr>`;
                    html += `<td>${yearData.year}</td>`;
                    html += `<td>${assets.toLocaleString()}</td>`;
                    html += `<td>${liabilities.toLocaleString()}</td>`;
                    html += `<td>${netAssets.toLocaleString()}</td>`;
                    html += `<td style="background: ${checkOk ? '#d4edda' : '#f8d7da'}">${check.toLocaleString()}</td>`;
                    html += `</tr>`;
                });
                
                html += '</table>';
                
                // Show chart data format
                html += '<h3>Chart Data Structure:</h3>';
                html += '<pre>' + JSON.stringify({
                    years: data.historicalData.map(d => d.year),
                    totalAssets: data.historicalData.map(d => d.metrics.totalAssets?.value || 0),
                    totalLiabilities: data.historicalData.map(d => d.metrics.totalLiabilities?.value || 0),
                    netAssets: data.historicalData.map(d => d.metrics.netAssets?.value || 0)
                }, null, 2) + '</pre>';
            } else {
                html += '<p>No historical data extracted</p>';
            }
            
            // Show full data structure
            html += '<h3>Full Data Structure:</h3>';
            html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            
            // Show console logs
            html += '<h3>Console Logs:</h3>';
            html += '<pre>' + logBuffer.map(log => 
                `[${log.type}] ${log.args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
                ).join(' ')}`
            ).join('\n') + '</pre>';
            
            results.innerHTML = html;
        }
        
        async function testFullIntegration() {
            clearStatus();
            const companyNumber = '05254058';
            
            addStatus('Starting full integration test...', 'info');
            
            // Check if parsers are loaded
            addStatus(`RealXBRLParser loaded: ${typeof RealXBRLParser !== 'undefined'}`, 
                     typeof RealXBRLParser !== 'undefined' ? 'success' : 'error');
            addStatus(`FinanceParser loaded: ${typeof FinanceParser !== 'undefined'}`, 
                     typeof FinanceParser !== 'undefined' ? 'success' : 'error');
            
            if (typeof FinanceParser === 'undefined') {
                addStatus('FinanceParser not loaded!', 'error');
                return;
            }
            
            try {
                addStatus(`Extracting financial data for company ${companyNumber}...`, 'info');
                const startTime = Date.now();
                
                const data = await FinanceParser.extractFinancialData(companyNumber);
                
                const elapsed = Date.now() - startTime;
                addStatus(`Extraction completed in ${elapsed}ms`, 'success');
                
                addStatus(`Total filings found: ${data.totalFilings}`, 'info');
                addStatus(`Filings with extracted data: ${data.filingsWithData}`, 
                         data.filingsWithData > 0 ? 'success' : 'warning');
                
                // Show results
                showResults(data);
                
            } catch (error) {
                addStatus(`Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }
        
        async function testSingleFiling() {
            clearStatus();
            const companyNumber = '05254058';
            
            addStatus('Testing single filing extraction...', 'info');
            
            try {
                // First get filing history
                const proxyUrl = `http://localhost:3002/api/proxy/companies-house/company/${companyNumber}/filing-history?category=accounts&items_per_page=5`;
                addStatus(`Fetching filing history...`, 'info');
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const filing = data.items[0];
                    addStatus(`Testing filing: ${filing.description} (${filing.date})`, 'info');
                    
                    if (filing.transaction_id) {
                        // Fetch XBRL
                        const xbrlUrl = `http://localhost:3002/api/proxy/ixbrl/${companyNumber}/${filing.transaction_id}?format=xhtml`;
                        addStatus(`Fetching XBRL document...`, 'info');
                        
                        const xbrlResponse = await fetch(xbrlUrl);
                        const xbrlText = await xbrlResponse.text();
                        
                        addStatus(`XBRL document size: ${xbrlText.length} characters`, 'info');
                        
                        // Parse with RealXBRLParser
                        if (typeof RealXBRLParser !== 'undefined') {
                            addStatus(`Parsing with RealXBRLParser...`, 'info');
                            const parsed = RealXBRLParser.parse(xbrlText);
                            
                            addStatus(`Parsing complete!`, 'success');
                            
                            // Show parsed values
                            const results = document.getElementById('results');
                            results.innerHTML = '<h2>Single Filing Results:</h2>';
                            results.innerHTML += '<h3>Extracted Values:</h3>';
                            results.innerHTML += '<pre>' + JSON.stringify(parsed, null, 2) + '</pre>';
                            
                            // Validate accounting equation
                            if (parsed.totalAssets && parsed.netAssets && parsed.totalLiabilities) {
                                const check = parsed.totalAssets.value - (parsed.netAssets.value + parsed.totalLiabilities.value);
                                const checkOk = Math.abs(check) < 10;
                                addStatus(`Accounting equation check: ${parsed.totalAssets.value} = ${parsed.netAssets.value} + ${parsed.totalLiabilities.value} (diff: ${check})`, 
                                         checkOk ? 'success' : 'warning');
                            }
                        }
                    }
                }
                
            } catch (error) {
                addStatus(`Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }
    </script>
</body>
</html>
