<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            color: white;
            z-index: 2;
            padding: 60px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
            background: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .bars {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        
        .bar {
            width: 20px;
            background: #6366f1;
            border-radius: 4px;
        }
        
        .bar1 { height: 50px; }
        .bar2 { height: 70px; }
        .bar3 { height: 40px; }
        
        h1 {
            font-size: 72px;
            font-weight: 800;
            margin: 0 0 20px 0;
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        h2 {
            font-size: 32px;
            font-weight: 400;
            margin: 0 0 40px 0;
            opacity: 0.95;
            line-height: 1.4;
        }
        
        .features {
            display: flex;
            gap: 40px;
            justify-content: center;
            font-size: 20px;
            opacity: 0.9;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .check {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pattern {
            position: absolute;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            opacity: 0.1;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.1) 35px, rgba(255,255,255,.1) 70px);
        }
        
        .url {
            position: absolute;
            bottom: 40px;
            left: 60px;
            font-size: 24px;
            opacity: 0.8;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="pattern"></div>
    
    <div class="container">
        <div class="logo">
            <div class="bars">
                <div class="bar bar1"></div>
                <div class="bar bar2"></div>
                <div class="bar bar3"></div>
            </div>
        </div>
        
        <h1>AI Business Intelligence</h1>
        <h2>5.5 Million UK Companies at Your Fingertips</h2>
        
        <div class="features">
            <div class="feature">
                <div class="check">✓</div>
                <span>10+ Data Sources</span>
            </div>
            <div class="feature">
                <div class="check">✓</div>
                <span>Risk Detection</span>
            </div>
            <div class="feature">
                <div class="check">✓</div>
                <span>Officer Search</span>
            </div>
        </div>
    </div>
    
    <div class="url">docspace.uk</div>
</body>
</html>
