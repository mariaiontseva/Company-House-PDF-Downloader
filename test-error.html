<!DOCTYPE html>
<html>
<head>
    <title>Error Test</title>
</head>
<body>
    <h1>Error Test Page</h1>
    <div id="status"></div>
    
    <script>
        const status = document.getElementById('status');
        
        window.addEventListener('error', function(event) {
            status.innerHTML += `<p style="color: red;">Error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}</p>`;
        });
        
        status.innerHTML += '<p>Loading scripts...</p>';
    </script>
    
    <script src="config.js?v=7"></script>
    <script src="enhanced-xbrl-parser.js?v=20250706-3"></script>
    <script src="enhanced-pdf-parser.js?v=20250706-1"></script>
    <script src="finance-parser.js?v=20250718-3"></script>
    
    <script>
        status.innerHTML += '<p style="color: green;">All scripts loaded successfully!</p>';
        
        // Test if FinanceParser is available
        if (typeof FinanceParser !== 'undefined') {
            status.innerHTML += '<p style="color: green;">FinanceParser is available</p>';
        } else {
            status.innerHTML += '<p style="color: red;">FinanceParser is NOT available</p>';
        }
    </script>
</body>
</html>
