<!DOCTYPE html>
<html>
<head>
    <title>Test Finance Tab Production</title>
    <script src="finance-parser.js"></script>
    <script src="enhanced-xbrl-parser.js"></script>
</head>
<body>
    <h1>Testing Finance Tab on Production</h1>
    <p>Current URL: <span id="current-url"></span></p>
    <p>Proxy URL: <span id="proxy-url"></span></p>
    <button onclick="testFinance()">Test Finance Data Extraction</button>
    <div id="output"></div>
    
    <script>
        // Show current environment
        document.getElementById('current-url').textContent = window.location.href;
        document.getElementById('proxy-url').textContent = FinanceParser.PROXY_URL;
        
        async function testFinance() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Loading...</p>';
            
            let html = '<h2>Test Results:</h2>';
            
            try {
                // Test 1: Direct Worker Test
                html += '<h3>1. Testing Cloudflare Worker:</h3>';
                const testUrl = 'https://api.companieshouse.gov.uk/company/09051662';
                const params = new URLSearchParams({
                    url: testUrl,
                    apiKey: '22aefa40-ee9e-47c0-b40a-2dd3c03165c6'
                });
                const workerUrl = `${FinanceParser.PROXY_URL}?${params.toString()}`;
                html += `<p>Worker URL: ${workerUrl}</p>`;
                
                const workerResponse = await fetch(workerUrl);
                html += `<p>Worker Response Status: ${workerResponse.status} ${workerResponse.statusText}</p>`;
                
                if (workerResponse.ok) {
                    const data = await workerResponse.json();
                    html += `<p style="color: green;">✓ Worker is working! Company: ${data.company_name}</p>`;
                } else {
                    html += `<p style="color: red;">✗ Worker failed</p>`;
                }
                
                // Test 2: Finance Parser
                html += '<h3>2. Testing Finance Parser:</h3>';
                console.log('Starting finance extraction...');
                const financeData = await FinanceParser.extractFinancialData('09051662');
                
                if (financeData && financeData.historicalData) {
                    html += `<p style="color: green;">✓ Finance data extracted!</p>`;
                    html += `<p>Historical filings: ${financeData.historicalData.length}</p>`;
                    
                    if (financeData.historicalData.length > 0) {
                        const latest = financeData.historicalData[0];
                        html += '<h4>Latest Filing:</h4>';
                        html += `<ul>`;
                        html += `<li>Date: ${latest.date}</li>`;
                        html += `<li>Description: ${latest.description}</li>`;
                        html += `<li>Type: ${latest.type}</li>`;
                        
                        if (latest.metrics) {
                            html += `<li>Metrics found: ${Object.keys(latest.metrics).length}</li>`;
                            if (latest.metrics.revenue) {
                                html += `<li>Revenue: ${latest.metrics.revenue.value}</li>`;
                            }
                            if (latest.metrics.employees) {
                                html += `<li>Employees: ${latest.metrics.employees.value}</li>`;
                            }
                        }
                        html += `</ul>`;
                    }
                } else {
                    html += `<p style="color: red;">✗ No finance data extracted</p>`;
                }
                
            } catch (error) {
                html += `<h3 style="color: red;">Error:</h3>`;
                html += `<pre>${error.message}\n${error.stack}</pre>`;
                console.error('Test error:', error);
            }
            
            // Check console logs
            html += '<h3>3. Check Console Logs:</h3>';
            html += '<p>Press F12 to open developer console and check for detailed logs</p>';
            
            output.innerHTML = html;
        }
        
        // Auto-run test
        window.onload = () => {
            console.log('Finance Parser loaded, PROXY_URL:', FinanceParser.PROXY_URL);
        };
    </script>
</body>
</html>
