<!DOCTYPE html>
<html>
<head>
    <title>Simple Finance Test</title>
    <script src="config.js"></script>
</head>
<body>
    <h1>Simple Finance Parser Test</h1>
    <button onclick="testParser()">Test Company 09051662</button>
    <div id="output" style="white-space: pre-wrap; font-family: monospace;"></div>
    
    <script src="enhanced-xbrl-parser.js"></script>
    <script src="finance-parser.js"></script>
    
    <script>
        const API_KEY = window.APP_CONFIG.COMPANIES_HOUSE_API_KEY;
        
        async function testParser() {
            const output = document.getElementById('output');
            output.textContent = 'Testing...\n';
            
            try {
                // Test direct iXBRL fetch
                const response = await fetch('http://localhost:3002/api/proxy/ixbrl/09051662/MzQzNzQ4MTU2NGFkaXF6a2N4');
                const xbrlText = await response.text();
                output.textContent += `Got iXBRL: ${xbrlText.length} chars\n`;
                
                // Test parsing
                const parser = new DOMParser();
                const doc = parser.parseFromString(xbrlText, 'text/html');
                
                // Find all ix: elements
                const allElements = doc.getElementsByTagName('*');
                let ixElements = 0;
                let sampleData = {};
                
                for (let elem of allElements) {
                    if (elem.tagName.toLowerCase().startsWith('ix:')) {
                        ixElements++;
                        const name = elem.getAttribute('name');
                        if (name && ixElements < 10) {
                            sampleData[name] = elem.textContent;
                        }
                    }
                }
                
                output.textContent += `Found ${ixElements} ix: elements\n`;
                output.textContent += 'Sample data:\n' + JSON.stringify(sampleData, null, 2) + '\n\n';
                
                // Test EnhancedXBRLParser
                if (typeof EnhancedXBRLParser !== 'undefined') {
                    const enhancedData = EnhancedXBRLParser.parse(xbrlText);
                    output.textContent += 'Enhanced parser result:\n' + JSON.stringify(enhancedData, null, 2).substring(0, 1000) + '...\n';
                }
                
            } catch (error) {
                output.textContent += `Error: ${error.message}\n`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
