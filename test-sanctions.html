<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sanctions Feature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a202c;
            color: #e2e8f0;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #4f46e5;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .sanctions-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <h1>Test Sanctions Feature</h1>
    
    <div class="test-section">
        <h2>Test Sanctioned Entities</h2>
        <p>Click to test companies that should show sanctions badges:</p>
        <button onclick="testSanctions('Gazprom')">Test Gazprom</button>
        <button onclick="testSanctions('Rosneft')">Test Rosneft</button>
        <button onclick="testSanctions('VTB Bank')">Test VTB Bank</button>
    </div>
    
    <div class="test-section">
        <h2>Test Non-Sanctioned Entities</h2>
        <p>Click to test companies that should NOT show sanctions badges:</p>
        <button onclick="testSanctions('Tesco PLC')">Test Tesco PLC</button>
        <button onclick="testSanctions('Barclays Bank')">Test Barclays Bank</button>
        <button onclick="testSanctions('British Airways')">Test British Airways</button>
    </div>
    
    <div id="result" class="result" style="display:none;"></div>
    
    <script>
        async function testSanctions(companyName) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `Testing "${companyName}"...\n`;
            
            try {
                const response = await fetch(`http://localhost:3002/api/sanctions/check/${encodeURIComponent(companyName)}`);
                const data = await response.json();
                
                resultDiv.innerHTML += `\nResponse:\n${JSON.stringify(data, null, 2)}\n`;
                
                if (data.data.sanctioned) {
                    resultDiv.innerHTML += `\n✅ SANCTIONED - Badge should appear`;
                    resultDiv.innerHTML += `\n<div style="margin-top:10px;">Preview: ${companyName} <span class="sanctions-badge">⚠️ Under Sanctions</span></div>`;
                } else {
                    resultDiv.innerHTML += `\n❌ NOT SANCTIONED - No badge should appear`;
                }
            } catch (error) {
                resultDiv.innerHTML += `\nError: ${error.message}`;
            }
        }
    </script>
</body>
</html>
