<!DOCTYPE html>
<html>
<head>
    <title>Test Company 09051662</title>
    <script src="enhanced-xbrl-parser.js"></script>
    <script src="finance-parser.js"></script>
</head>
<body>
    <h1>Testing Company 09051662 - Financial Data Extraction</h1>
    <button onclick="testCompany()">Test Extraction</button>
    <div id="output"></div>
    
    <script>
        async function testCompany() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Loading...</p>';
            
            try {
                console.log('Testing company 09051662...');
                const data = await FinanceParser.extractFinancialData('09051662');
                
                if (!data) {
                    output.innerHTML = '<p>No data extracted</p>';
                    return;
                }
                
                let html = '<h2>Financial Data for Company 09051662</h2>';
                
                // Show latest filing
                if (data.latestFiling) {
                    const latest = data.latestFiling;
                    html += '<h3>Latest Filing:</h3>';
                    html += `<p>${latest.date} - ${latest.description}</p>`;
                    
                    if (latest.metrics) {
                        html += '<h4>Metrics:</h4><ul>';
                        
                        // Specifically show revenue/turnover
                        if (latest.metrics.revenue) {
                            html += `<li><strong>Revenue/Turnover:</strong> ${latest.metrics.revenue.value} (${latest.metrics.revenue.formatted || latest.metrics.revenue.value})</li>`;
                        } else {
                            html += '<li><strong>Revenue/Turnover:</strong> NOT FOUND</li>';
                        }
                        
                        // Show employees
                        if (latest.metrics.employees) {
                            html += `<li><strong>Employees:</strong> ${latest.metrics.employees.value}</li>`;
                        } else {
                            html += '<li><strong>Employees:</strong> NOT FOUND</li>';
                        }
                        
                        // Show all other metrics
                        Object.entries(latest.metrics).forEach(([key, value]) => {
                            if (key !== 'revenue' && key !== 'employees' && value && value.value !== undefined) {
                                html += `<li><strong>${key}:</strong> ${value.value} (${value.formatted || value.value})</li>`;
                            }
                        });
                        html += '</ul>';
                    }
                }
                
                // Show all historical data
                html += '<h3>All Historical Data:</h3>';
                data.historicalData.forEach((filing, index) => {
                    html += `<div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">`;
                    html += `<h4>${filing.date} - ${filing.description}</h4>`;
                    
                    if (filing.metrics.revenue) {
                        html += `<p>Revenue: ${filing.metrics.revenue.value}</p>`;
                    }
                    if (filing.metrics.employees) {
                        html += `<p>Employees: ${filing.metrics.employees.value}</p>`;
                    }
                    html += '</div>';
                });
                
                output.innerHTML = html;
                console.log('Full data:', data);
                
            } catch (error) {
                console.error('Error:', error);
                output.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
